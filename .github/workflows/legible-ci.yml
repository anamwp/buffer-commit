name: Legible CI

on:
  push:
    paths: ["legible/**", ".github/workflows/legible-ci.yml"]
  pull_request:
    paths: ["legible/**", ".github/workflows/legible-ci.yml"]

defaults:
  run:
    working-directory: legible

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: legible/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: E2E against the mock Buffer API
        env:
          BUFFER_CLIENT_ID: ci-client
          BUFFER_CLIENT_SECRET: ci-secret
          REDIRECT_URI: http://localhost:3000/auth/buffer/callback
          BUFFER_API_URL: http://localhost:4010/graphql
          BUFFER_AUTH_URL: http://localhost:4010
          ALLOW_PGLITE: "1"
          PGLITE_DIR: memory://
        run: |
          export SESSION_SECRET="$(openssl rand -base64 48)"
          export TOKEN_ENC_KEY="$(openssl rand -base64 32)"
          npm i -g playwright@1
          npx playwright install --with-deps chromium
          export NODE_PATH="$(npm root -g)"
          node scripts/mock-buffer.mjs &
          pnpm start -p 3000 &
          npx wait-on http://localhost:3000/api/health -t 60000
          mkdir -p shots && SHOTS_DIR=shots node e2e/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: legible/shots
          if-no-files-found: ignore
